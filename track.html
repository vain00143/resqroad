<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The report tracker is now part of the home page (index.html#track);
         keep old tracking links (track.html?id=RPT-1048) working. -->
    <meta http-equiv="refresh" content="0; url=index.html#track" />
    <title>Track a report | ResQRoad</title>
    <link rel="canonical" href="index.html#track" />
    <link rel="icon" type="image/png" href="assets/images/resqroad-mark.png" />
    <script>
      (function () {
        var id = new URLSearchParams(window.location.search).get("id");
        window.location.replace("index.html" + (id ? "?track=" + encodeURIComponent(id) : "") + "#track");
      })();
    </script>
  </head>
  <body>
    <p>The report tracker has moved. <a href="index.html#track">Track a report on the ResQRoad home page</a>.</p>
  </body>
</html>
