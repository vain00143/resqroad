<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap');
text { font-family: Poppins, 'Segoe UI', Arial, sans-serif; }
.title { font-size: 30px; font-weight: 700; fill: #110e0c; }
.sub { font-size: 15px; fill: #5d5550; }
.tname { font-size: 17px; font-weight: 600; fill: #ffffff; }
.tnote { font-size: 12.5px; fill: #fdf6ec; opacity: 0.85; }
